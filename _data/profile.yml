short_bio: >-
  <p>
    I am working on correcting OCR and ASR errors in Indic languages.
    My work also explores multimodal document understanding and cross-lingual reasoning in vision-language models.
  </p>
  <p>
    I submitted my doctoral thesis, <em>Context-Assisted Post-Text-Recognition Error Correction for Indic Languages</em>,
    at IIT Jodhpur in <strong>July 2026</strong>.
  </p>

