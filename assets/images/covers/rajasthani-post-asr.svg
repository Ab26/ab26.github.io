<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" role="img" aria-labelledby="title desc">
  <title id="title">Multi-view post-ASR correction for Rajasthani</title>
  <desc id="desc">A conceptual overview: transcripts from Whisper and MMS feed a gated correction model, which produces corrected Rajasthani text.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#46719b"/></marker>
  </defs>
  <rect width="560" height="350" rx="16" fill="#f3f8fd"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="280" y="34" font-size="18" fill="#45617b">MULTI-VIEW TEXT CORRECTION</text>
    <g fill="#fff" stroke="#9fbfda" stroke-width="2">
      <rect x="30" y="60" width="235" height="72" rx="10"/>
      <rect x="295" y="60" width="235" height="72" rx="10"/>
    </g>
    <g font-size="22" fill="#163957">
      <text x="147" y="89">Whisper</text><text x="147" y="116" font-size="18">transcript</text>
      <text x="412" y="89">MMS</text><text x="412" y="116" font-size="18">transcript</text>
    </g>
    <g fill="none" stroke="#46719b" stroke-width="3" marker-end="url(#arrow)">
      <path d="M147 132V157H230V179"/>
      <path d="M412 132V157H330V179"/>
      <path d="M280 241V278"/>
    </g>
    <rect x="115" y="182" width="330" height="59" rx="10" fill="#165d9c"/>
    <text x="280" y="219" font-size="23" fill="#fff">Gated correction model</text>
    <rect x="85" y="282" width="390" height="45" rx="10" fill="#e0f0e9" stroke="#91c4ad"/>
    <text x="280" y="311" font-size="22" fill="#245542">Corrected Rajasthani text</text>
  </g>
</svg>
