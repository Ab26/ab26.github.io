<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="600" fill="#f4f6fb"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b4a6b"/></marker></defs>
<text x="450" y="62" text-anchor="middle" font-size="30" font-weight="700" fill="#1f2a44">Training-free post-OCR correction</text>
<text x="450" y="98" text-anchor="middle" font-size="22" fill="#4a5878">Retrieval of in-context examples with CharBM25</text>
<rect x="50" y="170" width="200" height="110" rx="14" fill="#fff" stroke="#3b4a6b" stroke-width="3"/>
<text x="150" y="215" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2a44">OCR sentence</text>
<text x="150" y="248" text-anchor="middle" font-size="18" fill="#4a5878">Hindi / Marathi</text>
<rect x="350" y="170" width="200" height="110" rx="14" fill="#dbe6ff" stroke="#3b4a6b" stroke-width="3"/>
<text x="450" y="215" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2a44">CharBM25</text>
<text x="450" y="248" text-anchor="middle" font-size="18" fill="#4a5878">character n-gram BM25</text>
<rect x="650" y="170" width="200" height="110" rx="14" fill="#fff" stroke="#3b4a6b" stroke-width="3"/>
<text x="750" y="215" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2a44">LLM (3B-32B)</text>
<text x="750" y="248" text-anchor="middle" font-size="18" fill="#4a5878">few-shot prompt</text>
<line x1="252" y1="225" x2="346" y2="225" stroke="#3b4a6b" stroke-width="3" marker-end="url(#a)"/>
<line x1="552" y1="225" x2="646" y2="225" stroke="#3b4a6b" stroke-width="3" marker-end="url(#a)"/>
<text x="450" y="322" text-anchor="middle" font-size="17" fill="#4a5878">examples sharing similar error patterns</text>
<rect x="650" y="390" width="200" height="90" rx="14" fill="#e3f4e8" stroke="#2f7d4f" stroke-width="3"/>
<text x="750" y="432" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2a44">Corrected text</text>
<text x="750" y="460" text-anchor="middle" font-size="17" fill="#4a5878">no fine-tuning</text>
<line x1="750" y1="282" x2="750" y2="386" stroke="#3b4a6b" stroke-width="3" marker-end="url(#a)"/>
<rect x="50" y="390" width="500" height="90" rx="14" fill="#fff" stroke="#9aa6c0" stroke-width="2" stroke-dasharray="8 6"/>
<text x="300" y="428" text-anchor="middle" font-size="19" fill="#1f2a44">Compared with domain-random and dense retrieval</text>
<text x="300" y="458" text-anchor="middle" font-size="17" fill="#4a5878">20,000-sentence benchmark, five news domains</text>
<text x="450" y="560" text-anchor="middle" font-size="15" fill="#7a86a0">Schematic overview</text>
</svg>
